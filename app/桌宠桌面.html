<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>钢蛋儿桌面宠物</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #petRoot {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transform: none !important;
      zoom: 1 !important;
    }
    body { -webkit-app-region: no-drag; cursor: grab; }
    body.dragging { cursor: grabbing; }
    .gangdaner-pet-video {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
      transform: none !important;
      scale: 1 !important;
      transition: none !important;
      animation: none !important;
      filter: drop-shadow(0 16px 28px rgba(15, 23, 42, 0.18));
    }
  </style>
</head>
<body>
  <div id="petRoot"></div>
  <script src="./桌宠运行时.js"></script>
  <script>
    let pet;
    window.gangdanerPet.getManifest().then((manifest) => {
      pet = window.createGangdanerPet(document.getElementById("petRoot"), manifest);
      window.gangdanerPet.onEvent((key) => pet.setState(key));
    });

    const DRAG_THRESHOLD = 5;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let dragging = false;

    window.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || !window.gangdanerPet) return;
      pointerId = event.pointerId;
      startX = event.screenX;
      startY = event.screenY;
      dragging = false;
      document.body.setPointerCapture(pointerId);
    });

    window.addEventListener("pointermove", (event) => {
      if (pointerId !== event.pointerId || !window.gangdanerPet) return;
      if (!dragging && Math.hypot(event.screenX - startX, event.screenY - startY) >= DRAG_THRESHOLD) {
        dragging = true;
        document.body.classList.add("dragging");
        window.gangdanerPet.startDrag();
      }
      if (dragging) window.gangdanerPet.moveDrag();
    });

    function endDrag(event) {
      if (pointerId !== event.pointerId) return;
      if (dragging && window.gangdanerPet) window.gangdanerPet.endDrag();
      document.body.classList.remove("dragging");
      try { document.body.releasePointerCapture(pointerId); } catch (_) {}
      pointerId = null;
      dragging = false;
    }
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    window.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (window.gangdanerPet) window.gangdanerPet.showMenu();
    });
  </script>
</body>
</html>
