<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>钢蛋儿桌面宠物</title>
  <style>
    * { box-sizing: border-box; }
    :root { --pet-size: 420px; }
    html, body, #petRoot {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transform: none !important;
      zoom: 1 !important;
    }
    body { -webkit-app-region: no-drag; cursor: grab; }
    body.dragging { cursor: grabbing; }
    .gangdaner-pet-video {
      position: absolute;
      left: 50%;
      right: auto;
      top: auto;
      bottom: 0;
      width: var(--pet-size) !important;
      height: calc(var(--pet-size) * 0.74) !important;
      max-width: var(--pet-size) !important;
      max-height: calc(var(--pet-size) * 0.74) !important;
      margin-left: calc(var(--pet-size) / -2);
      display: block;
      object-fit: contain;
      object-position: bottom center;
      background: transparent;
      pointer-events: none;
      transform: none !important;
      scale: 1 !important;
      transition: none !important;
      animation: none !important;
      filter: drop-shadow(0 16px 28px rgba(15, 23, 42, 0.18));
    }
    @keyframes petPatBounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.08) translateY(-6px); }
      65% { transform: scale(0.96) translateY(3px); }
      100% { transform: scale(1); }
    }
    .pat-bounce {
      animation: petPatBounce 0.35s cubic-bezier(0.25, 1.4, 0.5, 1);
    }
    #bubble {
      position: fixed;
      left: 4%;
      right: 4%;
      bottom: calc(var(--pet-size) * 0.74 + 6px);
      z-index: 5;
      padding: 9px 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.96);
      color: #28344d;
      font: 600 13px/1.4 "Microsoft YaHei UI", sans-serif;
      box-shadow: 0 8px 26px rgba(31, 45, 76, 0.18);
      opacity: 0;
      transform: translateY(6px);
      transform-origin: bottom center;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      text-align: center;
      word-break: break-word;
      white-space: normal;
    }
    #bubble.show { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
    #bubble.reminder { background: rgba(255, 248, 222, 0.98); color: #795319; }

    #quickChatBox {
      position: fixed;
      left: 4%;
      right: 4%;
      bottom: calc(var(--pet-size) * 0.74 + 6px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 28px rgba(31, 45, 76, 0.22);
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transform-origin: bottom center;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    #quickChatBox.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    #quickChatInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #1e293b;
      font: 600 13px/1.4 "Microsoft YaHei UI", sans-serif;
      padding: 4px 0;
    }
    #quickChatInput::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    #quickChatSend {
      border: none;
      outline: none;
      background: #3b82f6;
      color: #ffffff;
      font: 600 12px/1 "Microsoft YaHei UI", sans-serif;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #quickChatSend:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div id="petRoot"></div>
  <div id="bubble"></div>
  <div id="quickChatBox">
    <input type="text" id="quickChatInput" placeholder="想对钢蛋儿说什么？" maxlength="150" autocomplete="off" />
    <button id="quickChatSend">发送</button>
  </div>
  <script src="./桌宠运行时.js"></script>
  <script>
    let pet;
    let petSize = 420;
    function applyPetSize() {
      document.documentElement.style.setProperty("--pet-size", petSize + "px");
    }
    window.gangdanerPet.getSettings().then((s) => { petSize = s.sizePx; applyPetSize(); });
    window.gangdanerPet.onSettings((s) => { petSize = s.sizePx; applyPetSize(); });
    const petRoot = document.getElementById("petRoot");
    window.gangdanerPet.getManifest().then((manifest) => {
      pet = window.createGangdanerPet(petRoot, manifest);
      window.gangdanerPet.onEvent((key) => pet.setState(key));
    });
    const bubble=document.getElementById("bubble"); let bubbleTimer;
    window.gangdanerPet.onBubble(({text,kind,seconds})=>{bubble.textContent=text;bubble.className=`show ${kind==='chatter'||kind==='chat'?'':'reminder'}`;clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.className="",Number(seconds||8)*1000);});
    bubble.addEventListener("click",()=>{bubble.className="";window.gangdanerPet.openChat();});

    // Quick Chat UI Handling
    const quickChatBox = document.getElementById("quickChatBox");
    const quickChatInput = document.getElementById("quickChatInput");
    const quickChatSend = document.getElementById("quickChatSend");

    function interactiveRects() {
      const rects = [];
      const left = (window.innerWidth - petSize) / 2;
      rects.push({ left, top: window.innerHeight - petSize, right: left + petSize, bottom: window.innerHeight });
      if (bubble.classList.contains("show")) rects.push(bubble.getBoundingClientRect());
      if (quickChatBox.classList.contains("show")) rects.push(quickChatBox.getBoundingClientRect());
      return rects;
    }
    function updateMouseIgnore(x, y) {
      if (dragging) {
        window.gangdanerPet.setIgnoreMouse(false);
        return;
      }
      const inside = interactiveRects().some((r) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom);
      window.gangdanerPet.setIgnoreMouse(!inside);
    }
    window.addEventListener("mousemove", (event) => updateMouseIgnore(event.clientX, event.clientY));
    window.addEventListener("mouseleave", () => { if (!dragging) window.gangdanerPet.setIgnoreMouse(true); });

    function openQuickChat() {
      bubble.className = ""; // Hide bubble if showing
      quickChatBox.classList.add("show");
      quickChatInput.focus();
    }
    function closeQuickChat() {
      quickChatBox.classList.remove("show");
      quickChatInput.value = "";
    }

    async function submitQuickChat() {
      const text = quickChatInput.value.trim();
      if (!text) return;
      closeQuickChat();
      const res = await window.gangdanerPet.sendChat(text);
      if (!res.ok) {
        bubble.textContent = res.error || "暂时没连上模型喵";
        bubble.className = "show reminder";
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => bubble.className = "", 6000);
      }
    }

    quickChatSend.addEventListener("click", submitQuickChat);
    quickChatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitQuickChat();
      } else if (e.key === "Escape") {
        closeQuickChat();
      }
    });

    // Automatically close quick chat when input loses focus or window blurs
    quickChatInput.addEventListener("blur", () => {
      setTimeout(() => {
        if (document.activeElement !== quickChatSend && document.activeElement !== quickChatInput) {
          closeQuickChat();
        }
      }, 150);
    });

    window.addEventListener("blur", () => {
      closeQuickChat();
    });

    // Multi-click detection (Double-click = Patting, Triple-click = Header Chat Box)
    const DRAG_THRESHOLD = 5;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let dragging = false;
    let clickCount = 0;
    let clickTimer = null;

    function triggerPattingEffect() {
      petRoot.classList.remove("pat-bounce");
      void petRoot.offsetWidth; // Force reflow
      petRoot.classList.add("pat-bounce");
      setTimeout(() => petRoot.classList.remove("pat-bounce"), 360);
      window.gangdanerPet.triggerPatting();
    }

    window.addEventListener("pointerdown", (event) => {
      if (quickChatBox.classList.contains("show") && !quickChatBox.contains(event.target)) {
        closeQuickChat();
      }

      if (event.button !== 0 || !window.gangdanerPet) return;
      if (quickChatBox.contains(event.target)) return;

      pointerId = event.pointerId;
      startX = event.screenX;
      startY = event.screenY;
      dragging = false;
      document.body.setPointerCapture(pointerId);
    });

    window.addEventListener("pointermove", (event) => {
      if (pointerId !== event.pointerId || !window.gangdanerPet) return;
      if (!dragging && Math.hypot(event.screenX - startX, event.screenY - startY) >= DRAG_THRESHOLD) {
        dragging = true;
        document.body.classList.add("dragging");
        window.gangdanerPet.startDrag();
      }
      if (dragging) window.gangdanerPet.moveDrag();
    });

    // 16-Direction Mouse Look Logic
    const LOOK_IMAGES = [];
    const LOOK_ALLOWED_STATES = ["blinking", "look_mouse"];
    const DEAD_ZONE = 80;
    const SMOOTH = 0.14;
    let smoothX = 0, smoothY = 0;
    let currentLookDirection = null;
    let pendingDirection = null;
    let pendingSince = 0;

    const centerImg = new Image();
    centerImg.src = "./08_可替换素材/跟随鼠标/center.webp";
    LOOK_IMAGES.push(centerImg);

    for (let i = 0; i < 16; i++) {
      const img = new Image();
      img.src = `./08_可替换素材/跟随鼠标/look_${String(i).padStart(2, "0")}.webp`;
      LOOK_IMAGES.push(img);
    }

    function getDirectionIndex(dx, dy) {
      const distance = Math.hypot(dx, dy);
      if (distance < DEAD_ZONE) return 0;

      let angle = Math.atan2(dy, dx);
      if (angle < 0) angle += Math.PI * 2;
      const count = 16;
      return (Math.round((angle / (Math.PI * 2)) * count) % count) + 1;
    }

    function applyDirectionFrame(dirIdx) {
      if (dirIdx === currentLookDirection) return;
      currentLookDirection = dirIdx;

      const currentState = pet?.getState?.();
      if (LOOK_ALLOWED_STATES.includes(currentState) && !quickChatBox.classList.contains("show") && !petRoot.classList.contains("pat-bounce")) {
        const media = pet?.media;
        if (media && media.tagName === "IMG") {
          media.src = LOOK_IMAGES[dirIdx]?.src || LOOK_IMAGES[0].src;
        } else if (media && media.tagName === "VIDEO") {
          pet.setState("look_mouse");
          if (pet.media && pet.media.tagName === "IMG") {
            pet.media.src = LOOK_IMAGES[dirIdx]?.src || LOOK_IMAGES[0].src;
          }
        }
      }
    }

    function requestDirection(targetDir) {
      if (targetDir === currentLookDirection) {
        pendingDirection = null;
        return;
      }
      if (targetDir !== pendingDirection) {
        pendingDirection = targetDir;
        pendingSince = performance.now();
        return;
      }
      if (performance.now() - pendingSince >= 60) {
        applyDirectionFrame(targetDir);
        pendingDirection = null;
      }
    }

    window.gangdanerPet.onMouseLook(({ dx, dy }) => {
      const currentState = pet?.getState?.();
      if (!LOOK_ALLOWED_STATES.includes(currentState) || quickChatBox.classList.contains("show")) {
        return;
      }
      smoothX += (dx - smoothX) * SMOOTH;
      smoothY += (dy - smoothY) * SMOOTH;
      const targetDir = getDirectionIndex(smoothX, smoothY);
      requestDirection(targetDir);
    });

    function endDrag(event) {
      if (pointerId !== event.pointerId) return;
      if (dragging && window.gangdanerPet) {
        window.gangdanerPet.endDrag();
      } else if (!dragging) {
        clickCount++;

        if (clickCount === 3) {
          clearTimeout(clickTimer);
          clickCount = 0;
          openQuickChat();
        } else {
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => {
            if (clickCount === 2) {
              triggerPattingEffect();
            }
            clickCount = 0;
          }, 260);
        }
      }
      document.body.classList.remove("dragging");
      try { document.body.releasePointerCapture(pointerId); } catch (_) {}
      pointerId = null;
      dragging = false;
    }
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    window.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (window.gangdanerPet) window.gangdanerPet.showMenu();
    });
  </script>
</body>
</html>
