<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢蛋儿桌面宠物设置</title>
<style>body{margin:0;padding:28px;background:#f6f8fb;color:#172033;font:14px "Segoe UI",sans-serif}h1{margin:0 0 24px}section{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #17203312}label{display:flex;justify-content:space-between;align-items:center;margin:12px 0}input[type=range]{width:250px}button{border:0;border-radius:9px;padding:9px 13px;margin:4px;background:#e8eefc;cursor:pointer}.primary{background:#315efb;color:#fff}.action{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f5;padding:10px 0}.action:first-child{border-top:0}.muted{color:#687386;font-size:12px}</style></head>
<body><h1>钢蛋儿桌面宠物设置</h1><section><h2>显示大小</h2><label><span>尺寸：<b id="sizeText">420</b> px</span><input id="size" type="range" min="88" max="760" step="1"></label><div><button data-size="100">100</button><button data-size="200">200</button><button data-size="300">300</button><button data-size="420">420</button><button data-size="680">680</button></div><label><span>全屏应用时隐藏</span><input id="hide" type="checkbox"></label></section>
<section><h2>切换动作</h2><div class="muted">动作来自“08_可替换素材/状态映射.json”</div><div id="actions"></div></section>
<section><button id="open">打开素材文件夹</button></section>
<script>
const size=document.getElementById('size'),sizeText=document.getElementById('sizeText'),hide=document.getElementById('hide');
function show(s){size.value=s.sizePx||420;sizeText.textContent=size.value;hide.checked=!!s.hideOnFullScreen}window.gangdanerPet.getSettings().then(show);window.gangdanerPet.onSettings(show);
size.oninput=()=>sizeText.textContent=size.value;size.onchange=()=>window.gangdanerPet.updateSettings({sizePx:Number(size.value)});hide.onchange=()=>window.gangdanerPet.updateSettings({hideOnFullScreen:hide.checked});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>window.gangdanerPet.updateSettings({sizePx:Number(b.dataset.size)}));document.getElementById('open').onclick=()=>window.gangdanerPet.openAssetsFolder();
window.gangdanerPet.getManifest().then(m=>{const box=document.getElementById('actions');Object.entries(m.states).forEach(([key,s])=>{const row=document.createElement('div');row.className='action';row.innerHTML=`<span>${s.label||key}</span><span><button class="primary">预览</button><button>替换</button></span>`;const [preview,replace]=row.querySelectorAll('button');preview.onclick=()=>window.gangdanerPet.sendEvent(key);replace.onclick=()=>window.gangdanerPet.replaceAsset(key);box.appendChild(row)})});
</script></body></html>
