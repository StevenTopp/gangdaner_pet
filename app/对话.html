<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢蛋儿 · 陪姑姑聊天</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:linear-gradient(150deg,#fff9f4,#f3f6ff);font:14px "Microsoft YaHei UI",sans-serif;color:#24304a;display:grid;grid-template-rows:auto 1fr auto}.head{padding:18px 20px;background:#ffffffd9;border-bottom:1px solid #e8ebf3;display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover}.name{font-size:18px;font-weight:800}.state{font-size:12px;color:#7a849a;margin-top:3px}.messages{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}.empty{text-align:center;color:#99a1b3;margin:auto}.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap}.user{align-self:flex-end;background:#4f6df5;color:#fff;border-bottom-right-radius:5px}.pet{align-self:flex-start;background:#fff;box-shadow:0 5px 18px #26365a12;border-bottom-left-radius:5px}.composer{padding:14px;background:#ffffffea;border-top:1px solid #e8ebf3;display:flex;gap:10px}textarea{flex:1;resize:none;height:48px;max-height:120px;border:1px solid #dce1ec;border-radius:14px;padding:12px;font:inherit;outline:none}textarea:focus{border-color:#7087f7}button{border:0;border-radius:13px;padding:0 18px;background:#4f6df5;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.error{color:#bd3c3c;font-size:12px;padding:0 16px 8px}</style></head>
<body><header class="head"><img class="avatar" src="../assets/icon/icon.png"><div><div class="name">钢蛋儿</div><div class="state" id="state">正在眨眼 · 陪姑姑聊天</div></div></header><main class="messages" id="messages"><div class="empty">姑姑想和钢蛋儿聊什么？</div></main><div><div class="error" id="error"></div><footer class="composer"><textarea id="input" placeholder="和钢蛋儿说点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button id="send">发送</button></footer></div><script>
const box=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),error=document.getElementById('error');function draw(items){box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">姑姑想和钢蛋儿聊什么？</div>';return}items.forEach(m=>{const d=document.createElement('div');d.className=`msg ${m.role==='user'?'user':'pet'}`;d.textContent=m.content;box.appendChild(d)});box.scrollTop=box.scrollHeight}async function submit(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';error.textContent='';const old=await window.gangdanerPet.getConversation();draw([...old,{role:'user',content:text},{role:'assistant',content:'钢蛋儿正在想……'}]);send.disabled=true;const r=await window.gangdanerPet.sendChat(text);send.disabled=false;if(!r.ok)error.textContent=r.error;draw(await window.gangdanerPet.getConversation());input.focus()}send.onclick=submit;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}};window.gangdanerPet.getConversation().then(draw);window.gangdanerPet.onState(v=>document.getElementById('state').textContent=`正在${v.label} · 陪姑姑聊天`);input.focus();
</script></body></html>
